name: ci
on:
  push: { branches: [main, agent-main] }
  pull_request:
permissions:
  contents: read
jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both, because a checker that walks paths is exactly the kind of code
        # that passes on one platform and fails on the other.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: ./scripts/release-check.sh
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      # The desktop's types are generated from nebula-core and committed, so a
      # Rust change that forgot `make types` shows up here as a diff.
      - run: cargo test -p nebula-core --features ts --lib
      - run: git diff --exit-code -- apps/desktop/src/types
