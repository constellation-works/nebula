name: ci
on:
  push: { branches: [main, agent-main] }
  pull_request:
permissions:
  contents: read
# Every input is pinned to an immutable id (STD-05 §R23): actions by full
# commit SHA (the tag in the comment is for humans and Dependabot, which bumps
# the two together), the toolchain by exact version (the one
# rust-toolchain.toml names), and pnpm by version and sha512.
jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both, because a checker that walks paths is exactly the kind of code
        # that passes on one platform and fails on the other.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A wall clock outside the tests themselves (STD-03 §R22): a hung child
    # ends the job, not the runner's six-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with: { toolchain: "1.98.1", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The desktop shell is a workspace member, and on Linux Tauri links the
      # system webview and tray libraries.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --check
      - run: ./scripts/release-check.sh
      - run: make standards-check
      - run: make terminal-guard
      - run: ./scripts/check-dependency-direction.sh
      - run: make test-modules
      - run: ./scripts/check-file-size.sh
      # `--locked` everywhere: a stale Cargo.lock fails instead of being
      # silently rewritten.
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      # Structural checker regressions are exercised through their entry points.
      - run: bash scripts/test-structural-checks.sh
      # `--all-targets` leaves doctests out.
      - run: cargo test --locked --workspace --doc
      # The desktop's types are generated from nebula-core and committed. The
      # script exports into a fresh directory and compares the whole of
      # apps/desktop/src/types with it, so a Rust change that forgot
      # `make types` fails here whether it adds, removes or changes a file.
      - run: ./scripts/check-types.sh
      # The same suites under a hostile HOME, TMPDIR inside a git repository
      # and GIT_DIR exported: no test may read or write the host's state.
      - if: runner.os == 'Linux'
        run: ./scripts/hostile-env-test.sh
  # The frontend, and the Tauri crate on the platform the app is for. No
  # `tauri build` here: the .app is unsigned and built locally.
  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with: { toolchain: "1.98.1", components: clippy }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Installs the pnpm version that package.json's `packageManager` names.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # The action ignores the pin's sha512; this checks it, and the version
      # that runs, against the registry before pnpm installs anything.
      - run: ./scripts/check-pnpm-pin.sh
        working-directory: .
      - run: pnpm install --frozen-lockfile
      # Advisories in the npm tree (STD-05 §R24). Fixes are overrides and the
      # unfixable ones dated ignores, both in pnpm-workspace.yaml.
      - run: pnpm audit --audit-level moderate
      # src/types is generated from nebula-core and committed; a hand edit, a
      # stale file or a forgotten `make types` fails here.
      - run: ./scripts/check-types.sh
        working-directory: .
      - run: pnpm tsc --noEmit
      - run: pnpm vitest run
      - run: cargo clippy --locked -p nebula-desktop --all-targets -- -D warnings
  # The desktop's security test: the production CSP, in the native webview,
  # blocks inline script and remote images while the UI and IPC work
  # (STD-04 §R8, §R13). Linux, because Xvfb gives the app a display of its
  # own there; `REQUIRE_WEBVIEW=1` makes a skipped test a failure.
  webview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with: { toolchain: "1.98.1" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb
      # Installs the pnpm version that package.json's `packageManager` names.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # The action ignores the pin's sha512; this checks it, and the version
      # that runs, against the registry before pnpm installs anything.
      - run: ./scripts/check-pnpm-pin.sh
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run --auto-servernum pnpm test:webview
        env:
          REQUIRE_WEBVIEW: "1"
