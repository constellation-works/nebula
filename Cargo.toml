[package]
name = "nebula"
version = "0.1.0"
edition = "2024"
description = "Idea lineage graph: capture a thought in five seconds, trace where it came from years later."

[[bin]]
name = "neb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
