[workspace]
resolver = "3"
members = [
    "crates/nebula-core",
    "crates/neb",
    "apps/desktop/src-tauri",
]

# Shared by every member, so a version bump is one edit and `release-check.sh`
# has one place to read.
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Idea lineage graph: capture a thought in five seconds, trace where it came from years later."
license = "MIT"
repository = "https://github.com/constellation-works/nebula"

[workspace.dependencies]
nebula-core = { path = "crates/nebula-core" }
# No `color` and no `wrap_help`: either makes clap query the terminal on its
# own, and help must read the same on every machine (STD-01 §R17).
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
clap_complete = "4"
# Test-only: isolates each test process's environment before any test thread
# starts (crates/nebula-core/tests/support). Already in the tree through Tauri.
ctor = "0.8"
# `flock` for the corpus write lock: std has no portable file lock, and this
# is the thin cross-platform wrapper. Its own dependencies (rustix, windows-sys)
# already arrive with the desktop's Tauri tree.
fs4 = "1"
# `sigaction` for holding INT/TERM/HUP while a git child is live
# (`nebula-core`'s `git` module); rustix has no safe `sigaction`. Already
# locked, one version, through the desktop's tree.
libc = "0.2"
# `killpg`, `waitid(WNOWAIT)` and `poll` for the supervised git runner, as safe
# wrappers. Already locked, one version, through `fs4`.
rustix = { version = "1", features = ["process", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
shlex = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
ts-rs = "12"

[profile.release]
strip = true
lto = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
