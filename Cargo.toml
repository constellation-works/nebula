[package]
name = "nebula"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Idea lineage graph: capture a thought in five seconds, trace where it came from years later."
license = "MIT"
repository = "https://github.com/constellation-works/nebula"

[[bin]]
name = "neb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
