# pnpm settings. esbuild is the one dependency with a postinstall worth running
# (it checks its native binary); nothing else gets to run scripts.
allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false

# CI runs `pnpm audit --audit-level moderate` (STD-05 §R24). A fix goes here
# as an override; an advisory with no fix goes in audit.ignore with a date.
overrides:
  # GHSA-68fv-2mgg-jv7q (high): fixed in source-map-js 1.2.2.
  "source-map-js@<1.2.2": ^1.2.2
  # GHSA-5c6j-r48x-rmvq (high) and GHSA-qj8w-gfj5-8c6v (moderate), both fixed
  # in 7.0.5. mocha 10, pinned by @wdio/mocha-framework 9, still asks for ^6.
  "serialize-javascript@<7.0.5": ^7.0.5
  # @wdio/utils 9 asks for browsers 2.x, which pulls vulnerable extract-zip.
  # browsers 3 replaces it and retains the browser-download API WDIO uses.
  "@wdio/utils>@puppeteer/browsers": 3.2.3
  # GHSA-xjj6-f33q-929c (CVE-2026-109869): patch all affected undici lines.
  "undici@<6.29.1": 6.29.1
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "undici@>=8.0.0 <8.12.2": 8.12.2
  # GHSA-g3hv-75wg-m249 (CVE-2026-118764, moderate): minimatch denial of
  # service via globparts amplification, fixed in 11.0.1. Scoped to the
  # vulnerable range so pre-7 lines keep resolving as dependents expect.
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
  # Companion: glob 10 reads minimatch's internal `.set` shape, which the
  # minimatch 10 rewrite removed, so glob 10 silently matches nothing under
  # 11. @wdio/config 9 (the only glob 10 consumer, for wdio spec discovery)
  # only needs `sync(pattern, {cwd, matchBase})`, which glob 13 keeps.
  # Pin it to the 13.0.6 already resolved via mocha 12.
  "@wdio/config>glob": 13.0.6

audit:
  ignore:
    # braces <=3.0.3 has no patched release (GHSA-vfj7-8cjw-p6xm). It is
    # dev-only via @wdio/mocha-framework > mocha > chokidar and is not shipped.
    # Re-review 2027-04-03.
    - GHSA-vfj7-8cjw-p6xm
